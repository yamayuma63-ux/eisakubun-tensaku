// ---------- ローカル永続化(localStorage) ----------
const LS_PREFIX = "redpen:";
window.storage = {
  async get(key, shared) {
    const raw = localStorage.getItem(LS_PREFIX + (shared ? "shared:" : "") + key);
    return raw === null ? null : { key, value: raw, shared: !!shared };
  },
  async set(key, value, shared) {
    localStorage.setItem(LS_PREFIX + (shared ? "shared:" : "") + key, value);
    return { key, value, shared: !!shared };
  },
  async delete(key, shared) {
    localStorage.removeItem(LS_PREFIX + (shared ? "shared:" : "") + key);
    return { key, deleted: true, shared: !!shared };
  },
  async list(prefix, shared) {
    const base = LS_PREFIX + (shared ? "shared:" : "");
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(base)) {
        const bare = k.slice(base.length);
        if (!prefix || bare.startsWith(prefix)) keys.push(bare);
      }
    }
    return { keys, prefix, shared: !!shared };
  },
};

// ---------- APIキー管理 ----------
const API_KEY_STORAGE_KEY = "redpen:anthropic_api_key";
function getApiKey() {
  return localStorage.getItem(API_KEY_STORAGE_KEY) || "";
}
function setApiKey(key) {
  if (key) localStorage.setItem(API_KEY_STORAGE_KEY, key);
  else localStorage.removeItem(API_KEY_STORAGE_KEY);
}

// ---------- word-level diff (simple LCS) ----------
function tokenize(str) {
  return (str.match(/\s+|[A-Za-z']+|[^\sA-Za-z']/g) || []);
}
function diffTokens(a, b) {
  const n = a.length, m = b.length;
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) {
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }
  const ops = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { ops.push({ t: "eq", v: a[i] }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ t: "del", v: a[i] }); i++; }
    else { ops.push({ t: "ins", v: b[j] }); j++; }
  }
  while (i < n) { ops.push({ t: "del", v: a[i] }); i++; }
  while (j < m) { ops.push({ t: "ins", v: b[j] }); j++; }
  return ops;
}

function getFallbackProblems(elements) {
  const used = {};
  return elements.map(el => {
    const bank = FALLBACK_PROBLEMS[el.id] || [{ japanese: `(${el.label}を使った文を作って訳してください)`, modelAnswer: "" }];
    const idx = (used[el.id] || 0) % bank.length;
    used[el.id] = (used[el.id] || 0) + 1;
    return { elementId: el.id, japanese: bank[idx].japanese, modelAnswer: bank[idx].modelAnswer };
  });
}

function extractJsonSubstring(text) {
  const firstObj = text.indexOf("{");
  const firstArr = text.indexOf("[");
  let start = -1;
  if (firstObj === -1) start = firstArr;
  else if (firstArr === -1) start = firstObj;
  else start = Math.min(firstObj, firstArr);
  if (start === -1) return text;
  const openChar = text[start];
  const closeChar = openChar === "{" ? "}" : "]";
  const lastClose = text.lastIndexOf(closeChar);
  if (lastClose === -1 || lastClose < start) return text;
  return text.slice(start, lastClose + 1);
}

async function withRetry(fn, times) {
  let lastErr;
  const n = times || 2;
  for (let i = 0; i < n; i++) {
    try { return await fn(); } catch (e) {
      lastErr = e;
      console.error("withRetry attempt " + (i + 1) + " failed", e);
      if (i < n - 1) await new Promise(r => setTimeout(r, 500));
    }
  }
  throw lastErr;
}

async function callClaudeRaw(system, userContent, maxTokens) {
  const apiKey = getApiKey();
  if (!apiKey) {
    throw new Error("APIキーが設定されていません。「設定」タブからAPIキーを入力してください。");
  }
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: maxTokens || 1000,
      system,
      messages: [{ role: "user", content: userContent }],
    }),
  });
  if (!res.ok) {
    let detail = "";
    try { const errJson = await res.json(); detail = errJson?.error?.message || ""; } catch (e) {}
    throw new Error("APIエラー(" + res.status + "): " + (detail || "リクエストに失敗しました"));
  }
  const data = await res.json();
  const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
  const clean = text.replace(/```json|```/g, "").trim();
  return extractJsonSubstring(clean);
}

// ---------- weighted selection helpers ----------
function weightedSample(pool, weightFn, n) {
  // pool: array; weightFn(item)->number>0; returns n items (allows repeats if pool smaller)
  const picks = [];
  const avail = pool.slice();
  while (picks.length < n && avail.length > 0) {
    const keyed = avail.map(item => ({ item, key: -Math.log(Math.random() + 1e-9) / weightFn(item) }));
    keyed.sort((a, b) => a.key - b.key);
    picks.push(keyed[0].item);
    avail.splice(avail.findIndex(x => x === keyed[0].item), 1);
    if (avail.length === 0 && picks.length < n) avail.push(...pool);
  }
  return picks;
}

        <div style={{ fontSize: 12, color: "#8A8478" }}>{session.problems.length}問 / 対象要素: {[...new Set(session.problems.map(p => ELEMENT_MAP[p.elementId]?.label))].join("・")}</div>
        {session.usedFallback && <div style={{ fontSize: 11, color: "#C9A227", marginTop: 6 }}>※ AI生成が使えなかったため予備問題セットです</div>}
      </div>
      {session.problems.map((p, i) => (
        <div key={i} style={{ ...cardStyle, marginBottom: 12 }}>
          <div style={{ fontSize: 11, color: "#8A8478", marginBottom: 6, fontFamily: "'IBM Plex Mono', monospace" }}>
            Q{i + 1} ・ {ELEMENT_MAP[p.elementId]?.label}
          </div>
          <div style={{ fontFamily: "'Newsreader', serif", fontSize: 17, color: "#2A2620", marginBottom: 10, lineHeight: 1.7 }}>{p.japanese}</div>
          {session.stage === "answering" ? (
            <textarea
              value={p.userAnswer || ""}
              onChange={(e) => onAnswerChange(i, e.target.value)}
              placeholder="英訳を入力"
              style={{ width: "100%", minHeight: 60, fontFamily: "'Newsreader', serif", fontSize: 15.5, border: "1px solid #E7E0CE", borderRadius: 6, padding: 8, boxSizing: "border-box" }}
            />
          ) : (
            <div>
              <div style={{ fontSize: 14.5, color: p.correct ? "#2F5D50" : "#B23A2E", fontFamily: "'IBM Plex Mono', monospace", marginBottom: 4 }}>
                {p.correct ? "◯ 正解" : "✕ 要修正"}
              </div>
              <div style={{ fontSize: 14, color: "#3A3529", marginBottom: 4 }}><b>あなたの解答:</b> {p.userAnswer}</div>
              <div style={{ fontSize: 14, color: "#2F5D50", marginBottom: 4 }}><b>模範解答:</b> {p.correctedText}</div>
              <div style={{ fontSize: 12.5, color: "#5A5347", fontStyle: "italic" }}>{p.feedback}</div>
            </div>
          )}
        </div>
      ))}
      {session.stage === "answering" ? (
        <button onClick={onSubmit} disabled={loading || !allAnswered} style={primaryBtn(loading || !allAnswered)}>
          {loading ? "採点中..." : "採点する"}
        </button>
      ) : (
        <button onClick={onFinish} style={primaryBtn(false)}>完了</button>
      )}
    </div>
  );
}

function App() {
  const [view, setView] = useState("write"); // write | drill | freewrite | history | settings
  const [apiKeyPresent, setApiKeyPresent] = useState(!!getApiKey());
  const [apiKeyInput, setApiKeyInput] = useState(getApiKey());
  const [apiKeySaved, setApiKeySaved] = useState(false);
  const [essay, setEssay] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [result, setResult] = useState(null);
  const [editedText, setEditedText] = useState("");
  const [editing, setEditing] = useState(false);
  const [myNote, setMyNote] = useState("");
  const [history, setHistory] = useState([]);
  const [historyLoading, setHistoryLoading] = useState(false);
  const taRef = useRef(null);

  // drill state
  const [drillState, setDrillState] = useState({ progressPointer: 0, elementStats: {} });
  const [drillLoading, setDrillLoading] = useState(false);
  const [drillError, setDrillError] = useState("");
  const [drillWarning, setDrillWarning] = useState("");
  const [showExport, setShowExport] = useState(false);
  const [session, setSession] = useState(null);
  const [drillReady, setDrillReady] = useState(false);

  // freewrite state
  const [freeWriteState, setFreeWriteState] = useState({ lastTs: null, usedThemes: [] });
  const [freeWriteReady, setFreeWriteReady] = useState(false);
  const [freeWriteLoading, setFreeWriteLoading] = useState(false);
  const [freeWriteError, setFreeWriteError] = useState("");
  const [freeWriteSession, setFreeWriteSession] = useState(null); // {source, theme, instructionsJa, essayText, stage, result}

  useEffect(() => {
    if (view === "history") loadHistory();
    if (view === "drill" && !drillReady) loadDrillState();
    if (view === "freewrite" && !freeWriteReady) loadFreeWriteState();
  }, [view]);

  async function loadHistory() {
    setHistoryLoading(true);
    try {
      const list = await window.storage.list("essay:", false);
      const keys = (list && list.keys) || [];
      const items = [];
      for (const k of keys) {
        try {
          const r = await window.storage.get(k, false);
          if (r) items.push(JSON.parse(r.value));
        } catch (e) {}
      }
      items.sort((a, b) => b.ts - a.ts);
      setHistory(items);
    } catch (e) {
      setError("履歴の読み込みに失敗しました。");
    }
    setHistoryLoading(false);
  }

  async function loadDrillState() {
    try {
      const r = await window.storage.get("drill-state", false);
      if (r) {
        const parsed = JSON.parse(r.value);
        if (parsed.curriculumVersion !== CURRICULUM_VERSION) {
          // カリキュラムの形式が変わったため進捗をリセット
          const reset = { progressPointer: 0, elementStats: {}, curriculumVersion: CURRICULUM_VERSION };
          setDrillState(reset);
          window.storage.set("drill-state", JSON.stringify(reset), false).catch(() => {});
        } else {
          setDrillState(parsed);
        }
      } else {
        setDrillState({ progressPointer: 0, elementStats: {}, curriculumVersion: CURRICULUM_VERSION });
      }
    } catch (e) { console.error("loadDrillState failed", e); }
    setDrillReady(true);
  }

  async function saveDrillState(next) {
    const withVer = { ...next, curriculumVersion: CURRICULUM_VERSION };
    setDrillState(withVer);
    try {
      await window.storage.set("drill-state", JSON.stringify(withVer), false);
      setDrillWarning("");
    } catch (e) {
      console.error("saveDrillState failed, retrying once", e);
      try {
        await window.storage.set("drill-state", JSON.stringify(withVer), false);
        setDrillWarning("");
      } catch (e2) {
        console.error("saveDrillState retry failed", e2);
        const msg = (e2 && (e2.message || e2.toString())) || "不明なエラー";
        setDrillWarning("進捗の保存が一時的にできていません(学習はこのまま続けられます): " + msg);
      }
    }
  }

  async function appendDrillLog(entries) {
    try {
      const r = await window.storage.get("drill-log", false).catch(() => null);
      let log = [];
      try { if (r) log = JSON.parse(r.value); } catch (e) {}
      log = [...log, ...entries];
      if (log.length > 400) log = log.slice(log.length - 400);
      await window.storage.set("drill-log", JSON.stringify(log), false);
    } catch (e) { /* best effort */ }
  }

  async function loadFreeWriteState() {
    try {
      const r = await window.storage.get("freewrite-state", false);
      if (r) setFreeWriteState(JSON.parse(r.value));
    } catch (e) { /* no state yet */ }
    setFreeWriteReady(true);
  }

  async function saveFreeWriteState(next) {
    setFreeWriteState(next);
    try {
      await window.storage.set("freewrite-state", JSON.stringify(next), false);
    } catch (e) {
      console.error("saveFreeWriteState failed", e);
      // 保存だけ静かに失敗させ、その場の学習は継続させる
    }
  }

  async function startFreeWrite() {
    setFreeWriteError("");
    setFreeWriteLoading(true);
    try {
      const source = FREEWRITE_SOURCES[Math.floor(Math.random() * FREEWRITE_SOURCES.length)];
      const t = await generateFreeWriteTheme(source);
      setFreeWriteSession({ source, theme: t.theme, instructionsJa: t.instructionsJa, essayText: "", stage: "writing", result: null });
    } catch (e) {
      setFreeWriteError("テーマの生成に失敗しました。もう一度お試しください。");
    }
    setFreeWriteLoading(false);
  }

  function recordFreeWriteMistakes(elementIds) {
    if (elementIds.length === 0) return;
    const stats = { ...drillState.elementStats };
    elementIds.forEach(id => {
      const cur = stats[id] || { attempts: 0, mistakes: 0 };
      stats[id] = { attempts: cur.attempts + 1, mistakes: cur.mistakes + 1 };
    });
    saveDrillState({ ...drillState, elementStats: stats });
  }

  async function startFreeWriteRemedial(elementIds) {
    const elements = [];
    elementIds.forEach(id => { if (ELEMENT_MAP[id]) { elements.push(ELEMENT_MAP[id]); elements.push(ELEMENT_MAP[id]); } }); // 2問ずつ
    await startRound("remedial", elements.slice(0, 10));
    setView("drill");
  }

  async function submitFreeWrite() {
    setFreeWriteLoading(true);
    setFreeWriteError("");
    try {
      const g = await gradeFreeWrite(freeWriteSession.theme, freeWriteSession.essayText);
      const cap = gateCap(g.scores.achievement);
      const rawTotal = FREEWRITE_CRITERIA.reduce((s, c) => s + g.scores[c.key], 0);
      const finalTotal = Math.min(rawTotal, cap);
      const mistakeElementIds = [...new Set((g.grammarMistakes || [])
        .filter(m => m.elementId && !m.minor && ELEMENT_MAP[m.elementId])
        .map(m => m.elementId))];
      const result = { ...g, rawTotal, cap, finalTotal, mistakeElementIds };
      setFreeWriteSession({ ...freeWriteSession, stage: "result", result });
      recordFreeWriteMistakes(mistakeElementIds);
      const nextState = {
        lastTs: Date.now(),
        usedThemes: [...freeWriteState.usedThemes, { ts: Date.now(), theme: freeWriteSession.theme, source: freeWriteSession.source.key, finalTotal }].slice(-50),
      };
      saveFreeWriteState(nextState);
      try {
        await window.storage.set("freewrite:" + Date.now(), JSON.stringify({
          ts: Date.now(), source: freeWriteSession.source.label, theme: freeWriteSession.theme,
          essayText: freeWriteSession.essayText, finalTotal, rawTotal, mistakeElementIds,
        }), false);
      } catch (e) { /* best effort */ }
    } catch (e) {
      setFreeWriteError("採点に失敗しました。もう一度お試しください。");
    }
    setFreeWriteLoading(false);
  }

  function pickDailyElements() {
    const n = CURRICULUM.length;
    const cycleDone = drillState.progressPointer >= n;
    if (!cycleDone) {
      // 1周目: 30日程度でカリキュラムを一周するペースで、同じ講を数日かけて繰り返す
      const idx = Math.floor(drillState.progressPointer) % n;
      const el = CURRICULUM[idx];
      const elements = [el, el, el, el, el];
      const increment = n / DAYS_TO_COMPLETE_CYCLE;
      return { elements, increment };
    }
    // 1周終了後はランダム出題
    const elements = [];
    for (let i = 0; i < 5; i++) elements.push(CURRICULUM[Math.floor(Math.random() * n)]);
    return { elements, increment: 0 };
  }

  function pickWeeklyElements() {
    const attemptedIds = Object.keys(drillState.elementStats);
    const pool = attemptedIds.length > 0 ? attemptedIds.map(id => ELEMENT_MAP[id]).filter(Boolean) : CURRICULUM.slice(0, Math.max(1, drillState.progressPointer));
    return weightedSample(pool, e => (drillState.elementStats[e.id]?.mistakes || 0) + 1, 10);
  }

  async function startRound(round, elements) {
    setDrillError("");
    setDrillWarning("");
    setDrillLoading(true);
    try {
      const probs = await generateDrillProblems(elements);
      if (!Array.isArray(probs) || probs.length !== elements.length) {
        throw new Error("problem count mismatch: expected " + elements.length + ", got " + (probs && probs.length));
      }
      const problems = probs.map(p => ({ ...p, userAnswer: "" }));
      setSession({ round, stage: "answering", problems, usedFallback: false });
    } catch (e) {
      console.error("generateDrillProblems failed, using fallback bank", e);
      const problems = getFallbackProblems(elements).map(p => ({ ...p, userAnswer: "" }));
      setSession({ round, stage: "answering", problems, usedFallback: true });
      setDrillWarning("AIによる問題生成が一時的にできなかったため、予備の問題セットを表示しています。");
    }
    setDrillLoading(false);
  }

  async function startDaily() {
    const { elements, increment } = pickDailyElements();
    await startRound("daily", elements);
    if (increment > 0) {
      const raw = drillState.progressPointer + increment;
      const next = { ...drillState, progressPointer: Math.min(raw, CURRICULUM.length) };
      saveDrillState(next);
    }
  }

  async function startWeekly() {
    await startRound("weekly", pickWeeklyElements());
  }

  function updateAnswer(i, val) {
    setSession(s => {
      const problems = s.problems.slice();
      problems[i] = { ...problems[i], userAnswer: val };
      return { ...s, problems };
    });
  }

  async function submitSession() {
    setDrillLoading(true);
    setDrillError("");
    try {
      const graded = await gradeDrillAnswers(session.problems);
      const problems = session.problems.map((p, i) => ({
        ...p,
        correct: graded[i].correct,
        correctedText: graded[i].correctedText,
        feedback: graded[i].feedback,
        mistakeElementId: graded[i].mistakeElementId,
      }));
      // update stats
      const stats = { ...drillState.elementStats };
      problems.forEach(p => {
        const target = p.elementId;
        stats[target] = stats[target] || { attempts: 0, mistakes: 0 };
        stats[target] = { attempts: stats[target].attempts + 1, mistakes: stats[target].mistakes + (p.correct ? 0 : 1) };
        if (!p.correct && p.mistakeElementId && p.mistakeElementId !== target && ELEMENT_MAP[p.mistakeElementId]) {
          const m = p.mistakeElementId;
          stats[m] = stats[m] || { attempts: 0, mistakes: 0 };
          stats[m] = { ...stats[m], mistakes: stats[m].mistakes + 1 };
        }
      });
      saveDrillState({ ...drillState, elementStats: stats });
      appendDrillLog(problems.map(p => ({ ts: Date.now(), round: session.round, elementId: p.elementId, japanese: p.japanese, userAnswer: p.userAnswer, correct: p.correct, mistakeElementId: p.mistakeElementId })));
      setSession({ ...session, stage: "result", problems });
    } catch (e) {
      setDrillError("採点に失敗しました。もう一度お試しください。");
    }
    setDrillLoading(false);
  }

  async function finishSession() {
    const wrong = session.problems.filter(p => !p.correct);
    const isRemedialRound = session.round === "remedial" || session.round === "weeklyRemedial";
    if (wrong.length > 0 && !isRemedialRound) {
      const ids = [...new Set(wrong.map(p => p.mistakeElementId && ELEMENT_MAP[p.mistakeElementId] ? p.mistakeElementId : p.elementId))];
      const remedialElements = [];
      ids.forEach(id => { remedialElements.push(ELEMENT_MAP[id]); remedialElements.push(ELEMENT_MAP[id]); }); // 2問ずつ
      const nextRound = session.round === "weekly" ? "weeklyRemedial" : "remedial";
      await startRound(nextRound, remedialElements.slice(0, 10));
    } else {
      setSession(null);
    }
  }

  async function handleSubmit() {
    if (!essay.trim()) return;
    setLoading(true);
    setError("");
    try {
      const r = await callClaude(essay.trim());
      setResult(r);
      setEditedText(r.correctedText);
      setMyNote("");
      setEditing(false);
      setView("result");
    } catch (e) {
      setError("添削中にエラーが発生しました。もう一度お試しください。");
    }
    setLoading(false);
  }

  async function handleSave() {
    if (!result) return;
    const entry = {
      ts: Date.now(), original: essay.trim(), correctedText: editedText,
      rubric: result.rubric, issues: result.issues, overallComment: result.overallComment, myNote,
    };
    try {
      await window.storage.set("essay:" + entry.ts, JSON.stringify(entry), false);
      setEssay(""); setResult(null); setView("history");
    } catch (e) { setError("保存に失敗しました。"); }
  }

  const avgScore = result ? (RUBRIC_KEYS.reduce((s, k) => s + result.rubric[k.key].score, 0) / RUBRIC_KEYS.length).toFixed(1) : null;
  const masteryList = Object.keys(drillState.elementStats)
    .map(id => ({ id, label: ELEMENT_MAP[id]?.label, ...drillState.elementStats[id] }))
    .filter(x => x.label)
    .sort((a, b) => (b.mistakes / b.attempts) - (a.mistakes / a.attempts));

  return (
    <div style={{ minHeight: "100vh", background: "#10161A", fontFamily: "'IBM Plex Mono', monospace", padding: "24px 16px 60px" }}>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Newsreader:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />

      <div style={{ maxWidth: 640, margin: "0 auto" }}>
        <header style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 20 }}>
          <div>
            <div style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 26, color: "#FAF6EC", letterSpacing: "-0.01em" }}>Red Pen</div>
            <div style={{ fontSize: 11, color: "#8A8478", marginTop: 2 }}>英作文添削ノート</div>
          </div>
          <nav style={{ display: "flex", gap: 14, fontSize: 12 }}>
            <button onClick={() => setView("write")} style={navBtn(view === "write")}>書く</button>
            <button onClick={() => setView("drill")} style={navBtn(view === "drill")}>特訓</button>
            <button onClick={() => setView("freewrite")} style={navBtn(view === "freewrite")}>自由作文</button>
            <button onClick={() => setView("history")} style={navBtn(view === "history")}>履歴</button>
            <button onClick={() => setView("settings")} style={navBtn(view === "settings")}>設定{!apiKeyPresent && " ⚠"}</button>
          </nav>
        </header>

        {error && <div style={errBox}>{error}</div>}

        {view === "write" && (
          <div style={cardStyle}>
            <div style={labelStyle}>今日の英作文</div>
            <textarea
              ref={taRef} value={essay} onChange={(e) => setEssay(e.target.value)}
              placeholder="ここに英作文を書いてください..."
              style={{ width: "100%", minHeight: 220, border: "none", outline: "none", resize: "vertical", fontFamily: "'Newsreader', serif", fontSize: 17, lineHeight: 1.8, color: "#2A2620", background: "transparent", boxSizing: "border-box" }}
            />
            <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 8 }}>
              <button onClick={handleSubmit} disabled={loading || !essay.trim()} style={primaryBtn(loading || !essay.trim())}>
                {loading ? "添削中..." : "添削してもらう"}
              </button>
            </div>
          </div>
        )}

        {view === "result" && result && (
          <div>
            <div style={cardStyle}>
              <div style={labelStyle}>添削原稿（見え消し表示）</div>
              <Manuscript original={essay} corrected={editedText} />
            </div>
            <div style={{ ...cardStyle, marginTop: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div style={labelStyle}>修正後の全文{editing ? "（編集中）" : ""}</div>
                <button onClick={() => setEditing(v => !v)} style={ghostBtn}>{editing ? "完了" : "手動で修正"}</button>
              </div>
              {editing ? (
                <textarea value={editedText} onChange={(e) => setEditedText(e.target.value)} style={{ width: "100%", minHeight: 140, fontFamily: "'Newsreader', serif", fontSize: 16, lineHeight: 1.8, color: "#2A2620", border: "1px solid #E7E0CE", borderRadius: 6, padding: 10, boxSizing: "border-box" }} />
              ) : (
                <div style={{ fontFamily: "'Newsreader', serif", fontSize: 16, lineHeight: 1.8, color: "#2A2620", whiteSpace: "pre-wrap" }}>{editedText}</div>
              )}
            </div>
            <div style={{ ...cardStyle, marginTop: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 10 }}>
                <div style={labelStyle}>採点基準（観点別）</div>
                <div style={{ fontFamily: "'Fraunces', serif", fontSize: 22, fontWeight: 700, color: "#C9A227" }}>{avgScore}<span style={{ fontSize: 12, color: "#8A8478" }}> /5</span></div>
              </div>
              {RUBRIC_KEYS.map(k => <ScoreDial key={k.key} label={k.label} score={result.rubric[k.key].score} comment={result.rubric[k.key].comment} />)}
            </div>
            <div style={{ ...cardStyle, marginTop: 14 }}>
              <div style={labelStyle}>指摘事項</div>
              <ul style={{ margin: 0, paddingLeft: 18, fontSize: 13.5, color: "#3A3529", lineHeight: 1.9 }}>
                {result.issues.map((it, i) => <li key={i}>{it}</li>)}
              </ul>
              <div style={{ marginTop: 10, fontSize: 13.5, color: "#3A3529", lineHeight: 1.8, fontStyle: "italic" }}>{result.overallComment}</div>
            </div>
            <div style={{ ...cardStyle, marginTop: 14 }}>
              <div style={labelStyle}>自分のメモ</div>
              <textarea value={myNote} onChange={(e) => setMyNote(e.target.value)} placeholder="気づいたこと、次に意識したいことなど" style={{ width: "100%", minHeight: 70, fontFamily: "'Newsreader', serif", fontSize: 15, color: "#2A2620", border: "1px solid #E7E0CE", borderRadius: 6, padding: 10, boxSizing: "border-box" }} />
            </div>
            <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
              <button onClick={() => setView("write")} style={ghostBtnWide}>書き直す</button>
              <button onClick={handleSave} style={primaryBtn(false)}>履歴に保存</button>
            </div>
          </div>
        )}

        {view === "drill" && (
          <div>
            {drillError && <div style={errBox}>{drillError}</div>}
            {drillWarning && (
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, fontSize: 11.5, color: "#8A8478", marginBottom: 14, lineHeight: 1.6 }}>
                <span>⚠ {drillWarning}</span>
                <button onClick={() => saveDrillState(drillState)} style={{ ...ghostBtn, whiteSpace: "nowrap" }}>今すぐ再送信</button>
              </div>
            )}
            {!session && (
              <div>
                <div style={{ ...cardStyle, marginBottom: 12 }}>
                  <div style={labelStyle}>進捗</div>
                  {drillState.progressPointer >= CURRICULUM.length ? (
                    <div style={{ fontSize: 13, color: "#3A3529" }}>カリキュラム1周 完了 ・ 以降はランダム出題です</div>
                  ) : (
                    <div style={{ fontSize: 13, color: "#3A3529" }}>
                      約{DAYS_TO_COMPLETE_CYCLE}日で1周予定 ・ 現在: {ELEMENT_MAP[CURRICULUM[Math.floor(drillState.progressPointer) % CURRICULUM.length].id].label}
                    </div>
                  )}
                  <div style={{ height: 6, background: "#E7E0CE", borderRadius: 3, marginTop: 8, overflow: "hidden" }}>
                    <div style={{ width: (Math.min(drillState.progressPointer, CURRICULUM.length) / CURRICULUM.length * 100) + "%", height: "100%", background: "linear-gradient(90deg,#B23A2E,#C9A227)" }} />
                  </div>
                </div>
                <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
                  <button onClick={startDaily} disabled={drillLoading} style={primaryBtn(drillLoading)}>{drillLoading ? "準備中..." : "今日の5問"}</button>
                  <button onClick={startWeekly} disabled={drillLoading || Object.keys(drillState.elementStats).length === 0} style={ghostBtnWide}>週次演習(10問)</button>
                </div>
                {masteryList.length > 0 && (
                  <div style={cardStyle}>
                    <div style={labelStyle}>要素別 定着度(誤答率が高い順)</div>
                    {masteryList.map(m => (
                      <div key={m.id} style={{ marginBottom: 10 }}>
                        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, color: "#4B4640" }}>
                          <span>{m.label}</span>
                          <span style={{ color: "#8A8478" }}>{m.attempts - m.mistakes}/{m.attempts} 正解</span>
                        </div>
                        <div style={{ height: 5, background: "#E7E0CE", borderRadius: 3, marginTop: 3, overflow: "hidden" }}>
                          <div style={{ width: (100 - (m.mistakes / m.attempts * 100)) + "%", height: "100%", background: "#2F5D50" }} />
                        </div>
                      </div>
                    ))}
                  </div>
                )}
                <div style={{ marginTop: 14 }}>
                  <button onClick={() => setShowExport(v => !v)} style={ghostBtnWide}>{showExport ? "進捗データを隠す" : "進捗データをバックアップ用に表示"}</button>
                  {showExport && (
                    <textarea
                      readOnly
                      value={JSON.stringify({ progressPointer: drillState.progressPointer, elementStats: drillState.elementStats }, null, 2)}
                      onFocus={(e) => e.target.select()}
                      style={{ width: "100%", minHeight: 140, marginTop: 8, fontFamily: "'IBM Plex Mono', monospace", fontSize: 11.5, color: "#3A3529", border: "1px solid #E7E0CE", borderRadius: 6, padding: 8, boxSizing: "border-box", background: "#FAF6EC" }}
                    />
                  )}
                </div>
              </div>
            )}
            {session && (
              <DrillSession session={session} onAnswerChange={updateAnswer} onSubmit={submitSession} onFinish={finishSession} loading={drillLoading} />
            )}
          </div>
        )}

        {view === "freewrite" && (() => {
          const daysSince = freeWriteState.lastTs ? (Date.now() - freeWriteState.lastTs) / 86400000 : Infinity;
          const dueIn = Math.max(0, Math.ceil(3 - daysSince));
          const isDue = daysSince >= 3;
          return (
            <div>
              {freeWriteError && <div style={errBox}>{freeWriteError}</div>}
              {!freeWriteSession && (
                <div>
                  <div style={{ ...cardStyle, marginBottom: 14 }}>
                    <div style={labelStyle}>自由英作文モード(3日に1回目安)</div>
                    {isDue ? (
                      <div style={{ fontSize: 13.5, color: "#B23A2E", fontWeight: 600 }}>🔔 今日は自由英作文の日です</div>
                    ) : (
                      <div style={{ fontSize: 13, color: "#8A8478" }}>次の目安まであと{dueIn}日(いつでも挑戦できます)</div>
                    )}
                    <div style={{ fontSize: 12, color: "#8A8478", marginTop: 8 }}>順天堂大学・英検準1級・英検1級形式のテーマからランダムに出題し、30点ルーブリックで採点します。</div>
                    <div style={{ marginTop: 12 }}>
                      <button onClick={startFreeWrite} disabled={freeWriteLoading} style={primaryBtn(freeWriteLoading)}>
                        {freeWriteLoading ? "準備中..." : "テーマを見る"}
                      </button>
                    </div>
                  </div>
                  {freeWriteState.usedThemes.length > 0 && (
                    <div style={cardStyle}>
                      <div style={labelStyle}>直近の記録</div>
                      {freeWriteState.usedThemes.slice(-5).reverse().map((t, i) => (
                        <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, color: "#4B4640", marginBottom: 6 }}>
                          <span>{new Date(t.ts).toLocaleDateString("ja-JP")}</span>
                          <span style={{ color: "#C9A227", fontWeight: 600 }}>{t.finalTotal}/30</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {freeWriteSession && freeWriteSession.stage === "writing" && (
                <div>
                  <div style={{ ...cardStyle, marginBottom: 12 }}>
                    <div style={labelStyle}>{freeWriteSession.source.label}</div>
                    <div style={{ fontFamily: "'Newsreader', serif", fontSize: 16.5, color: "#2A2620", lineHeight: 1.8, whiteSpace: "pre-wrap", marginBottom: 8 }}>{freeWriteSession.theme}</div>
                    <div style={{ fontSize: 12.5, color: "#8A8478", fontStyle: "italic" }}>{freeWriteSession.instructionsJa}</div>
                  </div>
                  <div style={cardStyle}>
                    <div style={labelStyle}>解答</div>
                    <textarea
                      value={freeWriteSession.essayText}
                      onChange={(e) => setFreeWriteSession({ ...freeWriteSession, essayText: e.target.value })}
                      placeholder="ここに英作文を書いてください..."
                      style={{ width: "100%", minHeight: 220, fontFamily: "'Newsreader', serif", fontSize: 16.5, lineHeight: 1.8, color: "#2A2620", border: "1px solid #E7E0CE", borderRadius: 6, padding: 10, boxSizing: "border-box" }}
                    />
                    <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 8 }}>
                      <button onClick={submitFreeWrite} disabled={freeWriteLoading || !freeWriteSession.essayText.trim()} style={primaryBtn(freeWriteLoading || !freeWriteSession.essayText.trim())}>
                        {freeWriteLoading ? "採点中..." : "採点する"}
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {freeWriteSession && freeWriteSession.stage === "result" && (
                <div>
                  <div style={{ ...cardStyle, marginBottom: 12 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                      <div style={labelStyle}>総合得点</div>
                      <div style={{ fontFamily: "'Fraunces', serif", fontSize: 28, fontWeight: 700, color: "#C9A227" }}>
                        {freeWriteSession.result.finalTotal}<span style={{ fontSize: 13, color: "#8A8478" }}> /30</span>
                      </div>
                    </div>
                    {freeWriteSession.result.finalTotal < freeWriteSession.result.rawTotal && (
                      <div style={{ fontSize: 12.5, color: "#B23A2E", marginTop: 6 }}>
                        課題達成が{freeWriteSession.result.scores.achievement}点のため、上限{freeWriteSession.result.cap}点が適用されました(素点{freeWriteSession.result.rawTotal}点)
                      </div>
                    )}
                  </div>
                  <div style={{ ...cardStyle, marginBottom: 12 }}>
                    <div style={labelStyle}>項目別スコア</div>
                    {FREEWRITE_CRITERIA.map(c => (
                      <CriteriaBar key={c.key} label={c.label} score={freeWriteSession.result.scores[c.key]} max={c.max} comment={freeWriteSession.result.comments[c.key]} />
                    ))}
                  </div>
                  <div style={{ ...cardStyle, marginBottom: 12 }}>
                    <div style={labelStyle}>総評</div>
                    <div style={{ fontSize: 13.5, color: "#3A3529", lineHeight: 1.8 }}>{freeWriteSession.result.overallComment}</div>
                  </div>
                  <div style={{ ...cardStyle, marginBottom: 12 }}>
                    <div style={labelStyle}>模範解答</div>
                    <div style={{ fontFamily: "'Newsreader', serif", fontSize: 15.5, color: "#2A2620", lineHeight: 1.8, whiteSpace: "pre-wrap" }}>{freeWriteSession.result.modelAnswer}</div>
                  </div>
                  {(freeWriteSession.result.grammarMistakes || []).length > 0 && (
                    <div style={{ ...cardStyle, marginBottom: 12 }}>
                      <div style={labelStyle}>文法的な誤り</div>
                      <ul style={{ margin: 0, paddingLeft: 18, fontSize: 13, color: "#3A3529", lineHeight: 1.8 }}>
                        {freeWriteSession.result.grammarMistakes.map((m, i) => (
                          <li key={i}>{m.description}{m.elementId && ELEMENT_MAP[m.elementId] ? `(${ELEMENT_MAP[m.elementId].label})` : ""}{m.minor ? " ※軽微" : ""}</li>
                        ))}
                      </ul>
                    </div>
                  )}
                  {freeWriteSession.result.mistakeElementIds.length > 0 && (
                    <div style={{ ...cardStyle, marginBottom: 12 }}>
                      <div style={labelStyle}>この誤りは記憶されました</div>
                      <div style={{ fontSize: 12.5, color: "#8A8478", marginBottom: 10 }}>
                        {freeWriteSession.result.mistakeElementIds.map(id => ELEMENT_MAP[id].label).join("・")} は今後の演習(今日の5問・週次演習)で重点的に出題されます。
                      </div>
                      <button onClick={() => startFreeWriteRemedial(freeWriteSession.result.mistakeElementIds)} disabled={drillLoading} style={ghostBtnWide}>
                        {drillLoading ? "準備中..." : "今すぐ和文英訳で復習する"}
                      </button>
                    </div>
                  )}
                  <button onClick={() => setFreeWriteSession(null)} style={primaryBtn(false)}>完了</button>
                </div>
              )}
            </div>
          );
        })()}

        {view === "history" && (
          <div>
            {historyLoading && <div style={{ color: "#8A8478", fontSize: 13 }}>読み込み中...</div>}
            {!historyLoading && history.length === 0 && (
              <div style={{ color: "#8A8478", fontSize: 13, textAlign: "center", padding: "40px 0" }}>まだ提出はありません。「書く」から始めましょう。</div>
            )}
            {history.map((h) => {
              const avg = (RUBRIC_KEYS.reduce((s, k) => s + h.rubric[k.key].score, 0) / RUBRIC_KEYS.length).toFixed(1);
              return (
                <div key={h.ts} style={{ ...cardStyle, marginBottom: 12 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "#8A8478" }}>
                    <span>{new Date(h.ts).toLocaleString("ja-JP")}</span>
                    <span style={{ color: "#C9A227", fontWeight: 600 }}>{avg}/5</span>
                  </div>
                  <div style={{ fontFamily: "'Newsreader', serif", fontSize: 14.5, color: "#3A3529", marginTop: 6, lineHeight: 1.7 }}>
                    {h.original.slice(0, 90)}{h.original.length > 90 ? "…" : ""}
                  </div>
                  {h.myNote && <div style={{ fontSize: 12, color: "#8A8478", marginTop: 6, fontStyle: "italic" }}>メモ: {h.myNote}</div>}
                </div>
              );
            })}
          </div>
        )}

        {view === "settings" && (
          <div>
            <div style={cardStyle}>
              <div style={labelStyle}>Anthropic APIキー</div>
              <div style={{ fontSize: 12.5, color: "#5A5347", lineHeight: 1.7, marginBottom: 12 }}>
                console.anthropic.com で発行した「sk-ant-...」から始まるキーを貼り付けてください。この端末のブラウザ内にのみ保存され、外部には送信されません(AI呼び出し時にAnthropicへ直接送信されるのみです)。
              </div>
              <input
                type="password"
                value={apiKeyInput}
                onChange={(e) => { setApiKeyInput(e.target.value); setApiKeySaved(false); }}
                placeholder="sk-ant-..."
                style={{ width: "100%", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: "#2A2620", border: "1px solid #E7E0CE", borderRadius: 6, padding: 10, boxSizing: "border-box" }}
              />
              <div style={{ display: "flex", gap: 10, marginTop: 10 }}>
                <button
                  onClick={() => { setApiKey(apiKeyInput.trim()); setApiKeyPresent(!!apiKeyInput.trim()); setApiKeySaved(true); }}
                  style={primaryBtn(false)}
                >
                  保存
                </button>
                <button
                  onClick={() => { setApiKey(""); setApiKeyInput(""); setApiKeyPresent(false); setApiKeySaved(false); }}
                  style={ghostBtn}
                >
                  削除
                </button>
              </div>
              {apiKeySaved && <div style={{ fontSize: 12, color: "#2F5D50", marginTop: 8 }}>保存しました。</div>}
              {!apiKeyPresent && <div style={{ fontSize: 12, color: "#B23A2E", marginTop: 8 }}>APIキーが未設定です。AI添削・問題生成が使えません。</div>}
            </div>
            <div style={{ ...cardStyle, marginTop: 14 }}>
              <div style={labelStyle}>データについて</div>
              <div style={{ fontSize: 12.5, color: "#5A5347", lineHeight: 1.8 }}>
                学習履歴・進捗はこの端末のSafari内(localStorage)に保存されます。Safariの「履歴とWebサイトデータを消去」を行うと消えてしまうのでご注意ください。他の端末とは同期されません。
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const cardStyle = { background: "#FAF6EC", border: "1px solid #E7E0CE", borderRadius: 10, padding: "18px 20px", boxShadow: "0 1px 0 rgba(0,0,0,0.2)" };
const labelStyle = { fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: "0.06em", color: "#8A8478", textTransform: "uppercase", marginBottom: 10 };
const errBox = { background: "#3A1E1B", color: "#F0B4AC", padding: "10px 14px", borderRadius: 6, fontSize: 13, marginBottom: 16 };
function navBtn(active) {
  return { background: "none", border: "none", cursor: "pointer", color: active ? "#C9A227" : "#8A8478", borderBottom: active ? "1.5px solid #C9A227" : "1.5px solid transparent", paddingBottom: 2, fontFamily: "'IBM Plex Mono', monospace" };
}
function primaryBtn(disabled) {
  return { background: disabled ? "#7A342C" : "#B23A2E", color: "#FAF6EC", border: "none", borderRadius: 6, padding: "10px 18px", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, cursor: disabled ? "not-allowed" : "pointer", fontWeight: 600 };
}
const ghostBtn = { background: "none", border: "1px solid #C9A227", color: "#8A6F1E", borderRadius: 6, padding: "5px 10px", fontSize: 11.5, cursor: "pointer", fontFamily: "'IBM Plex Mono', monospace" };
const ghostBtnWide = { ...ghostBtn, flex: 1, textAlign: "center", padding: "10px 0" };

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);
</script>
</body>
</html>
